html/head_include="<meta name='apple-mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'><meta name='mobile-web-app-capable' content='yes'><style>html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}canvas#canvas{touch-action:none;-webkit-tap-highlight-color:transparent;}#fs-btn{position:fixed;top:10px;right:10px;z-index:9999;width:46px;height:38px;border:none;border-radius:9px;background:rgba(0,0,0,0.45);color:#e8e0c8;font-size:20px;line-height:38px;text-align:center;cursor:pointer;}#fs-hint{position:fixed;left:50%;top:54px;transform:translateX(-50%);z-index:9999;max-width:86%;box-sizing:border-box;background:rgba(0,0,0,0.75);color:#f0ead8;font-size:14px;line-height:1.5;padding:10px 14px;border-radius:10px;display:none;}</style><script>(function(){function hint(){var h=document.getElementById('fs-hint');if(h){h.style.display='block';setTimeout(function(){h.style.display='none';},4500);}}function toggleFs(){var el=document.documentElement;var fsEl=document.fullscreenElement||document.webkitFullscreenElement;if(fsEl){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return;}var req=el.requestFullscreen||el.webkitRequestFullscreen;if(req){var p=req.call(el);if(p&&p['catch']){p['catch'](function(){hint();});}}else{hint();}}window.addEventListener('DOMContentLoaded',function(){var b=document.createElement('button');b.id='fs-btn';b.textContent='⛶';b.setAttribute('aria-label','全屏');b.addEventListener('click',toggleFs);document.body.appendChild(b);var h=document.createElement('div');h.id='fs-hint';h.textContent='此浏览器不支持网页全屏：iPhone 请点 Safari 底部「分享」→「添加到主屏幕」，再从主屏图标打开游戏即为全屏。';document.body.appendChild(h);});})();</script>"
