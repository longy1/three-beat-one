html/head_include="<style>body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}canvas#canvas{touch-action:none;-webkit-tap-highlight-color:transparent;will-change:transform;}#fs-btn{position:fixed;top:10px;right:10px;z-index:9999;width:46px;height:38px;border:none;border-radius:9px;background:rgba(0,0,0,0.45);color:#e8e0c8;font-size:20px;line-height:38px;text-align:center;cursor:pointer;}#fs-hint{position:fixed;left:50%;top:54px;transform:translateX(-50%);z-index:9999;max-width:86%;box-sizing:border-box;background:rgba(0,0,0,0.75);color:#f0ead8;font-size:14px;line-height:1.5;padding:10px 14px;border-radius:10px;display:none;}</style><script>(function(){function hint(){var h=document.getElementById('fs-hint');if(h){h.style.display='block';setTimeout(function(){h.style.display='none';},4500);}}function toggleFs(){var el=document.documentElement;var fsEl=document.fullscreenElement||document.webkitFullscreenElement;if(fsEl){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return;}var req=el.requestFullscreen||el.webkitRequestFullscreen;if(req){var p=req.call(el);if(p&&p['catch']){p['catch'](function(){hint();});}}else{hint();}}function fsKick(){var ms=[150,400,900,1500,3000,5000];for(var i=0;i<ms.length;i++){setTimeout(function(){window.dispatchEvent(new Event('resize'));try{window.scrollTo(0,0);}catch(e){}var c=document.getElementById('canvas');var w=document.documentElement.clientWidth,h=document.documentElement.clientHeight;if(c&&w&&h&&(c.style.width!==w+'px'||c.style.height!==h+'px')){c.style.width=w+'px';c.style.height=h+'px';window.dispatchEvent(new Event('resize'));}},ms[i]);}}var touchDevice=navigator.maxTouchPoints>0;if(touchDevice){var flip=false;setInterval(function(){if(document.hidden){return;}var c=document.getElementById('canvas');if(!c){return;}flip=!flip;c.style.transform=flip?'translateZ(0px)':'translateZ(0.01px)';},250);document.addEventListener('touchend',function(){var c=document.getElementById('canvas');if(!c){return;}c.style.display='none';void c.offsetHeight;c.style.display='block';},{passive:true});}window.addEventListener('DOMContentLoaded',function(){var b=document.createElement('button');b.id='fs-btn';b.textContent='⛶';b.setAttribute('aria-label','全屏');b.addEventListener('click',toggleFs);document.body.appendChild(b);var h=document.createElement('div');h.id='fs-hint';h.textContent='此浏览器不支持网页全屏：iPhone 请点 Safari 底部「分享」→「添加到主屏幕」，再从主屏图标打开游戏即为全屏。';document.body.appendChild(h);document.addEventListener('fullscreenchange',fsKick);document.addEventListener('webkitfullscreenchange',fsKick);});})();</script><script>(function(){var ios=/iP(hone|ad|od)/.test(navigator.userAgent);if(!ios){return;}function dims(){var w=window.innerWidth,h=window.innerHeight;if(window.visualViewport){w=Math.round(window.visualViewport.width);h=Math.round(window.visualViewport.height);}return [w,h];}var last=dims();function kick(force){var d=dims();if(!force&&d[0]===last[0]&&d[1]===last[1]){return;}last=d;try{window.scrollTo(0,0);}catch(e){}window.dispatchEvent(new Event('resize'));setTimeout(function(){window.dispatchEvent(new Event('resize'));},250);setTimeout(function(){window.dispatchEvent(new Event('resize'));},700);setTimeout(function(){window.dispatchEvent(new Event('resize'));},1500);}window.addEventListener('orientationchange',function(){setTimeout(function(){kick(true);},120);setTimeout(function(){kick(true);},600);});window.addEventListener('resize',function(){kick(false);});document.addEventListener('visibilitychange',function(){if(!document.hidden){kick(true);}});if(window.visualViewport){window.visualViewport.addEventListener('resize',function(){kick(true);});window.visualViewport.addEventListener('scroll',function(){try{if(window.visualViewport.scale===1){window.scrollTo(0,0);}}catch(e){}});}})();</script>"
